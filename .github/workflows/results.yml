# Pulls the official results from F1DB and commits them when a race has been
# run. This is what keeps the answer key current: the app never asks you to
# type a result in, so the only way a new round becomes checkable is here.
#
# Runs Monday and Tuesday mornings (races finish Sunday; F1DB usually lands
# the result within a day), and can be run by hand after a race.
name: Refresh results

on:
  schedule:
    - cron: "0 6 * * 1,2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: results
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # f1db.mjs parses YAML; playwright is a dev dependency and not needed here
      - name: Install
        run: npm install --omit=dev --no-audit --no-fund

      - name: Pull the official data
        run: node build/f1db.mjs --fetch

      # A generated answer key that fails its own checks must not be committed.
      - name: Check what came back
        run: node build/test-data.mjs

      - name: Commit if a round has landed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/; then
            echo "no new official results"
            exit 0
          fi
          rounds=$(node -e "const s=require('./data/season-2026.json');console.log(Object.keys(s.results).length)")
          git add data/
          git commit -q -m "Official results through round ${rounds}

          Generated by build/f1db.mjs from F1DB (CC BY 4.0)."
          git push
