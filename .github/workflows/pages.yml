# Publishes the app to GitHub Pages on every push to main.
#
# The app is served as it is - there is no build step, and no Jekyll, because
# deploying through Actions skips it. `enablement: true` turns Pages on the
# first time this runs, so nothing has to be switched on by hand.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The data is the app: if a circuit outline no longer matches the lap
      # length published for it, that is a bad deploy, not a bad test.
      - name: Check the data
        run: node build/test-data.mjs

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
